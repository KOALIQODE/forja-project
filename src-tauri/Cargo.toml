[package]
name = "forja-project"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "forja_project_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# IPC
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# LECTURA INTELIGENTE (CRITICAL)
tokio = { version = "1", features = ["full"] }  # Async I/O
memmap2 = "0.9"              # Memory mapping para archivos gigantes
bytes = "1.5"                # Slices eficientes

# BÚSQUEDA RÁPIDA
regex = "1.10"               # Búsqueda de patrones
aho-corasick = "1.1"         # Multi-pattern search (ultra-rápido)
rayon = "1.7"                # Paralelización
memchr = "2.7"

# CONCURRENCIA
parking_lot = "0.12"         # RwLock más rápido
dashmap = "5.5"              # HashMap concurrente (caché)

# SYNTAX HIGHLIGHTING (OPCIONAL - solo si lo necesitas)
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-json = "0.20"

# MISC
anyhow = "1.0"
tracing = "0.1"              # Logging/debugging

# Existing dependencies
dirs-next = "2"
pathdiff = "0.2"
git2 = { version = "0.20.3", features = ["vendored-libgit2"] }
ignore = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort" # Más rápido que "unwind"
