[package]
name = "forja-studio-editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "forja_backend"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# IPC
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# LECTURA INTELIGENTE
tokio = { version = "1", features = ["full"] }
memmap2 = "0.9"
bytes = "1.5"

# BÚSQUEDA RÁPIDA
regex = "1.10"
aho-corasick = "1.1"
rayon = "1.7"
memchr = "2.7"
notify = "6.1"

# CONCURRENCIA
parking_lot = "0.12"
dashmap = "5.5"
notify-debouncer-mini = "0.4"

# SYNTAX HIGHLIGHTING (Arquitectura Zed)
tree-sitter = { version = "0.24", features = ["wasm"] }
tree-sitter-highlight = "0.24" # Upgraded to match tree-sitter version
libloading = "0.7"             # Carga de .so/.dll
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"] }

# Parsers base (embebidos como fallback)

# MISC
anyhow = "1.0"
thiserror = "1.0" # Added thiserror for custom error types
tracing = "0.1"
dirs = "5.0"
lazy_static = "1.4"
pathdiff = "0.2"
chrono = "0.4"
git2 = { version = "0.20.3", features = ["vendored-libgit2"] }
ignore = "0.4"
glib = "0.18"
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
