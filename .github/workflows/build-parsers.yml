name: Build Parser Binaries

on:
  schedule:
    # Every Monday at 03:00 UTC — picks up upstream grammar updates automatically
    - cron: '0 3 * * 1'
  workflow_dispatch:
    # Also triggerable manually from the Actions tab in GitHub

jobs:
  build:
    name: Build parsers (${{ matrix.platform }})
    strategy:
      fail-fast: false   # keep building other platforms even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            ext: so
          - os: macos-13
            platform: macos-x86_64
            ext: dylib
          - os: macos-14
            platform: macos-arm64
            ext: dylib
          - os: windows-latest
            platform: windows-x86_64
            ext: dll

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo registry + compiled deps to speed up subsequent runs
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Linux: install GTK/WebKit system libraries required by glib-sys / webkit2gtk
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Windows: make sure we have a working C/C++ compiler in PATH
      - name: Install LLVM/Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Compile all parsers for ${{ matrix.platform }}
        working-directory: src-tauri
        run: cargo run --bin build-parsers --release -- --platform ${{ matrix.platform }} --out-dir ../dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List produced artifacts
        shell: bash
        run: ls -lh dist/ || true

      - name: Upload binaries to GitHub Release (tag "grammars")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grammars
          name: "Parser Binaries (auto-updated)"
          body: |
            Prebuilt tree-sitter grammar binaries for all supported platforms.
            Built automatically from upstream grammar sources — updated weekly.
          files: dist/*-${{ matrix.platform }}.${{ matrix.ext }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
