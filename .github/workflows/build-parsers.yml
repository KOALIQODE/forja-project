name: Build Parser Binaries

on:
  schedule:
    # Every Monday at 03:00 UTC — picks up upstream grammar updates automatically
    - cron: '0 3 * * 1'
  workflow_dispatch:
    # Also triggerable manually from the Actions tab in GitHub

jobs:
  build:
    name: Build parsers (${{ matrix.platform }})
    strategy:
      fail-fast: false   # keep building other platforms even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            ext: so
          - os: windows-latest
            platform: windows-x86_64
            ext: dll

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Linux: gcc + unzip are pre-installed on ubuntu-latest, just verify
      - name: Verify build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc --version
          unzip -v | head -1

      # Windows: install LLVM/Clang + use Git Bash for the shell script
      - name: Install LLVM/Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Build all parsers
        shell: bash
        run: |
          chmod +x .github/scripts/build-parsers.sh
          PLATFORM=${{ matrix.platform }} OUT_DIR=dist bash .github/scripts/build-parsers.sh

      - name: List produced artifacts
        shell: bash
        run: ls -lh dist/ || true

      - name: Upload binaries to GitHub Release (tag "grammars")
        uses: softprops/action-gh-release@v3
        with:
          tag_name: grammars
          name: "Parser Binaries (auto-updated)"
          body: |
            Prebuilt tree-sitter grammar binaries for all supported platforms.
            Built automatically from upstream grammar sources — updated weekly.
          files: dist/*-${{ matrix.platform }}.${{ matrix.ext }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
